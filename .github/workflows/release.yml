# Release (PLAN 8, fase 10.2): build the production installer and publish it on the VM,
# which serves it at https://api.DOMAIN/releases/ (DiscGo_X.Y.Z_x64-setup.exe, its .sig,
# the stable DiscGo-Setup.exe and, last, the updater's latest.json). The API notices the
# new latest.json within a minute and every app updates itself (PLAN fase 9A).
#
# Runs on a vX.Y.Z tag pushed by hand, and is called by release-please.yml when a release
# PR is merged (a tag created with GITHUB_TOKEN does not start workflows).
# Secrets: TAURI_SIGNING_PRIVATE_KEY, VM_HOST, VM_USER, VM_SSH_KEY, VM_KNOWN_HOSTS.
name: release

on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        description: Tag to release (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

jobs:
  installer:
    uses: ./.github/workflows/installer.yml
    with:
      ref: ${{ inputs.tag || github.ref }}
      environment: production
      tag: ${{ inputs.tag || github.ref_name }}
    secrets: inherit

  publish:
    needs: installer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: installer
          path: out
      - uses: ./.github/actions/vm-ssh
        with:
          host: ${{ secrets.VM_HOST }}
          user: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          known-hosts: ${{ secrets.VM_KNOWN_HOSTS }}
      - name: Publish to the VM
        run: bash .github/scripts/publish-release.sh out /opt/discgo-releases DiscGo-Setup.exe
