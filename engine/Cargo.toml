[package]
name = "discgo-engine"
description = "DiscGo native screen-capture engine (sidecar)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "discgo-engine"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
log.workspace = true
gstreamer = "0.25.4"
windows = { version = "0.62.2", features = ["Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }
gst-plugin-webrtc = { version = "0.15.4", default-features = false, features = ["livekit", "rustls-ring"] }
gstreamer-webrtc = "0.25.4"
gstreamer-sdp = "0.25.3"
glib = "0.22.10"
