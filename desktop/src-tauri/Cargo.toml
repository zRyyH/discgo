[package]
name = "discgo"
description = "DiscGo desktop shell"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "discgo_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
log.workspace = true
tauri-plugin-deep-link = "2.6.3"
tauri-plugin-opener = "2.7.2"
tauri-plugin-store = "2.5.0"
tauri-plugin-window-state = "2.5.0"
tauri-plugin-single-instance = { version = "2.5.5", features = ["deep-link"] }
keyring = "4.2.0"
