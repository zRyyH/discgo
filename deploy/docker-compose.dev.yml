# Dev infrastructure: PostgreSQL + LiveKit in --dev mode.
# LiveKit API key "devkey", secret "devsecret-0123456789abcdef0123456789" (HS256 needs >= 32 bytes).
# The API, engine and desktop app run on the host (see README.md).
name: discgo-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: discgo
      POSTGRES_PASSWORD: discgo
      POSTGRES_DB: discgo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discgo -d discgo"]
      interval: 2s
      timeout: 3s
      retries: 30

  livekit:
    image: livekit/livekit-server:v1.13.11
    # Ports are offset by 10000 so they do not collide with another LiveKit on
    # the standard 7880-7882 (e.g. inside WSL, which grabs 127.0.0.1:7880).
    command:
      - --dev
      - --bind=0.0.0.0
      - --node-ip=127.0.0.1
      - --config-body
      - |
        port: 17880
        rtc:
          tcp_port: 17881
          udp_port: 17882
        keys:
          devkey: devsecret-0123456789abcdef0123456789
    ports:
      - "17880:17880"
      - "17881:17881"
      - "17882:17882/udp"

  # S3-compatible storage for attachments in dev (SeaweedFS; MinIO no longer
  # publishes images). No credentials: any access key is accepted.
  s3:
    image: chrislusf/seaweedfs:4.50
    command: ["server", "-s3", "-s3.port=9000", "-dir=/data", "-volume.max=5"]
    ports:
      - "9000:9000"
    volumes:
      - s3data:/data

volumes:
  pgdata:
  s3data:
