# Development environment on the production VM (PLAN fase 10.5): its own API and
# PostgreSQL, run from the develop checkout in /opt/discgo-dev. nginx (api-dev.DOMAIN →
# 127.0.0.1:8081, releases from /opt/discgo-releases/dev), LiveKit (its own key pair)
# and the S3 bucket are shared with production (docker-compose.prod.yml).
#
#   cp deploy/.env.example deploy/.env  (and fill it: see deploy/README.md)
#   deploy/scripts/deploy.sh dev
name: discgo-dev

services:
  api:
    build: ../api
    image: discgo-api:dev
    restart: unless-stopped
    env_file: .env
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://discgo:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/discgo?sslmode=disable
    ports:
      - "127.0.0.1:8081:8080"
    # No hairpin NAT on the VM: api-dev.DOMAIN (RELEASES_URL) goes straight to nginx.
    extra_hosts:
      - api-dev.${DOMAIN:?set DOMAIN}:host-gateway
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: discgo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: discgo
    volumes:
      - pgdata-dev:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discgo -d discgo"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  pgdata-dev:
